# Engineers role definition
# Persistent user-managed workspaces. Multiple per feature.

role = "engineers"
scope = "feature"
nudge = "Check your hook and mail, then act accordingly."
prompt_template = "engineers.md.tmpl"

[session]
pattern = "{prefix}-engineers-{name}"
work_dir = "{town}/{feature}/engineers/{name}"
needs_pre_sync = true
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "{feature}/engineers/{name}"
GT_SCOPE = "feature"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "4h"
