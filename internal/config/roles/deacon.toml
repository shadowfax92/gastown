# Senior Engineer role definition
# Daemon beacon for heartbeats and monitoring. One per town.

role = "senior engineer"
scope = "town"
nudge = "Run 'gt prime' to check patrol status and begin heartbeat cycle."
prompt_template = "senior engineer.md.tmpl"

[session]
pattern = "hq-senior engineer"
work_dir = "{town}"
needs_pre_sync = false
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "senior engineer"
GT_SCOPE = "town"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "1h"
