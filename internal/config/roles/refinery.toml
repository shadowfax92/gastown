# Release Engineer role definition
# Merge queue processor with verification gates. One per feature.

role = "release engineer"
scope = "feature"
nudge = "Run 'gt prime' to check merge queue and begin processing."
prompt_template = "release engineer.md.tmpl"

[session]
pattern = "{prefix}-release engineer"
work_dir = "{town}/{feature}/release engineer/feature"
needs_pre_sync = true
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "{feature}/release engineer"
GT_SCOPE = "feature"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "2h"
