# QA Engineer role definition
# Per-feature worker monitor with progressive nudging. One per feature.

role = "QA engineer"
scope = "feature"
nudge = "Run 'gt prime' to check worker status and begin patrol cycle."
prompt_template = "QA engineer.md.tmpl"

[session]
pattern = "{prefix}-QA engineer"
work_dir = "{town}/{feature}/QA engineer"
needs_pre_sync = false
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "{feature}/QA engineer"
GT_SCOPE = "feature"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "1h"
