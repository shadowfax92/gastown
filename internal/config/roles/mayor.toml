# Product Manager role definition
# Global coordinator for cross-feature work. One per town.

role = "product manager"
scope = "town"
nudge = "Check mail and hook status, then act accordingly."
prompt_template = "product manager.md.tmpl"

[session]
pattern = "hq-product manager"
work_dir = "{town}/product manager"
needs_pre_sync = false
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "product manager"
GT_SCOPE = "town"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "1h"
