# Agent role definition
# Persistent identity, ephemeral sessions. Batch work dispatch. Multiple per feature.

role = "agent"
scope = "feature"
nudge = "Check your hook for work assignments."
prompt_template = "agent.md.tmpl"

[session]
pattern = "{prefix}-{name}"
work_dir = "{town}/{feature}/agents/{name}"
needs_pre_sync = false
start_command = "exec claude --dangerously-skip-permissions"

[env]
GT_ROLE = "{feature}/agents/{name}"
GT_SCOPE = "feature"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "2h"
