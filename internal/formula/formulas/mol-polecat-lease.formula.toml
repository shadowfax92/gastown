description = """
QA Engineer-side tracking of a single agent's lifecycle.

The QA Engineer bonds this molecule for each active agent, creating a lease that
tracks the agent from spawn through work to cleanup. This is the WITNESS'S
view of the agent, not the agent's own work molecule.

## Lifecycle States

```
BOOT ─► WORKING ─► VERIFYING ─► MERGE_REQUESTED ─► DONE
  │         │           │              │
  └─► STUCK ─┴─► STUCK ──┴──► STUCK ───┘
```

## Variables

| Variable | Required | Description |
|----------|----------|-------------|
| agent | Yes | Name of the agent |
| ticket | Yes | The ticket assigned to the agent |
| feature | Yes | The feature this agent belongs to |"""
formula = "mol-agent-lease"
version = 2

[[steps]]
id = "boot"
title = "Verify agent boots successfully"
description = """
Agent has been spawned. Verify it initializes and starts working.

**Check if alive:**
```bash
tmux capture-pane -t gt-{{feature}}-{{agent}} -p | tail -20
```

Look for:
- Claude prompt visible ("> " at start of line)
- `gt prime` output
- Signs of reading the assigned ticket

**If idle for >60 seconds:**
```bash
gt nudge {{feature}}/agents/{{agent}} "Begin work on {{ticket}}."
```

**If still no response after nudge:**
```bash
gt nudge {{feature}}/agents/{{agent}} "Are you there? Please acknowledge."
```

After 3 failed nudges, mark as stuck and escalate.

**Exit criteria:** Agent shows signs of active work on {{ticket}}."""

[[steps]]
id = "working"
title = "Monitor agent progress"
needs = ["boot"]
description = """
Agent is actively working. Monitor for stuck or completion.

**Periodic checks:**
- Use standard nudge protocol from QA Engineer CLAUDE.md
- Watch for POLECAT_DONE mail or agent_state=done

**Signs of progress:**
- Git commits appearing
- File changes visible in peek
- Active tool usage in tmux capture

**Signs of stuck:**
- Idle >15 minutes
- Repeated errors
- Explicit "I'm stuck" messages

**If POLECAT_DONE received or agent_state=done:**
Proceed to verifying step.

**Exit criteria:** Agent signals completion (POLECAT_DONE mail or state=done)."""

[[steps]]
id = "verifying"
title = "Verify agent work is merge-ready"
needs = ["working"]
description = """
Agent claims completion. Verify before sending to Release Engineer.

**1. Check git state:**
```bash
cd agents/{{agent}}
git status                    # Must be "working tree clean"
git stash list                # Must be empty
git log ofeaturein/main..HEAD     # Should have commits
```

**2. Verify branch is pushed:**
```bash
git log ofeaturein/$(git branch --show-current)..HEAD  # Should be empty
```

**3. Verify ticket is closed:**
```bash
bd show {{ticket}}             # Status should be 'closed'
```

**4. Spot-check quality (ZFC - your judgment):**
- Commits have reasonable messages
- Changes look related to ticket
- No obvious problems in git log

**If verification fails:**
Nudge agent to fix:
```bash
# Use --mode=queue to avoid interrupting in-flight tool calls
gt nudge --mode=queue {{feature}}/agents/{{agent}} "Verification failed: <ticket>. Please fix."
```
Return to working step.

**If verification passes:**
Proceed to merge_requested step.

**Exit criteria:** Git clean, branch pushed, ticket closed, work looks legit."""

[[steps]]
id = "merge_requested"
title = "Request merge from Release Engineer"
needs = ["verifying"]
description = """
Work verified. Send MERGE_READY to Release Engineer and wait.

**Send merge request:**
```bash
gt mail send {{feature}}/release engineer -s "MERGE_READY {{agent}}" -m "Branch: $(cd agents/{{agent}} && git branch --show-current)
Ticket: {{ticket}}
Agent: {{agent}}
Verified: clean git state, ticket closed"
```

**Update cleanup wisp state:**
```bash
bd update <wisp-id> --labels cleanup,agent:{{agent}},state:merge-requested
```

**Wait for MERGED response:**
The Release Engineer will:
1. Fetch and rebase the branch
2. Run tests
3. Merge to main (if pass)
4. Send MERGED mail back

This may take several minutes.

**If MERGED received:** Proceed to done step.
**If merge fails:** Release Engineer notifies, return to working state.

**Exit criteria:** MERGED mail received from Release Engineer."""

[[steps]]
id = "done"
title = "Complete agent cleanup"
needs = ["merge_requested"]
description = """
Merge confirmed. Clean up the agent.

**1. Kill the agent session:**
```bash
gt session kill {{feature}}/agents/{{agent}}
```

**2. Remove worktree (if ephemeral):**
```bash
git worktree remove agents/{{agent}} --force
```

**3. Delete local branch (if exists):**
```bash
git branch -D agent/{{agent}} 2>/dev/null || true
```

**4. Close this lease:**
```bash
bd close <this-lease-id>
```

**Exit criteria:** Agent session killed, worktree removed, lease closed."""

[vars]
[vars.agent]
description = "Name of the agent"
required = true

[vars.ticket]
description = "The ticket assigned to the agent"
required = true

[vars.feature]
description = "The feature this agent belongs to"
required = true
