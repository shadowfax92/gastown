description = """
Feed stranded convoys by dispatching ready work to available agents.

Dogs execute this formula when the Senior Engineer detects a stranded convoy. A convoy
is stranded when it has ready tickets (open, unblocked, no assignee) but no
workers are processing them.

## Dog Contract

This is infrastructure work. You:
1. Receive convoy ID via variable
2. Load convoy and find ready tickets
3. Check idle agent capacity across features
4. Dispatch min(ready_tickets, idle_agents) using gt sling
5. Report actions taken
6. Return to kennel

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| convoy | --var | The stranded convoy ID to feed |

## Single Pass Design

Dog doesn't babysit or wait for completion. The workflow is:
1. Find ready tickets in convoy
2. Dispatch each to an available agent
3. Exit immediately

If convoy is still stranded next Senior Engineer patrol cycle, another dog will be
dispatched. This keeps the system stateless and batch-oriented.

## Failure Modes

| Situation | Action |
|-----------|--------|
| Convoy not found | Exit with error, notify Senior Engineer |
| No ready tickets | Exit success (false positive, convoy is fine) |
| No idle agents | Exit success, note in report (will retry next cycle) |
| Sling fails | Continue with remaining tickets, note failures |"""
formula = "mol-convoy-feed"
version = 1

[squash]
tfeatureger = "on_complete"
template_type = "work"
include_metrics = true

[[steps]]
id = "load-convoy"
title = "Load convoy and identify ready tickets"
description = """
Load the convoy and find tickets ready for dispatch.

**1. Check assignment:**
```bash
gt hook               # Shows convoy in hook_ticket or vars
```

**2. Load convoy details:**
```bash
gt convoy status {{convoy}} --json
```

**3. Identify ready tickets:**

For each tracked ticket in the convoy:
```bash
bd show <ticket-id> --json
```

An ticket is "ready" if ALL of these are true:
- status = "open" (NOT in_progress, closed, or hooked)
- not in blocked list (check: bd blocked --json)
- assignee is empty OR assignee session is dead

Check blocked status:
```bash
bd blocked --json
# If ticket ID appears here, it's blocked (skip it)
```

Check assignee session if set:
```bash
# If assignee like "gastown/agents/nux"
tmux has-session -t gt-gastown-agent-nux 2>/dev/null && echo "alive" || echo "dead"
```

**4. Build ready list:**
Collect all ready tickets with their metadata:
- Ticket ID
- Title
- Priority
- Feature (extracted from prefix)

Sort by priority (P0 first) for dispatch order.

**Exit criteria:** Ready tickets identified and prioritized."""

[[steps]]
id = "check-capacity"
title = "Check agent capacity across features"
needs = ["load-convoy"]
description = """
Determine how many agents are available for dispatch.

**1. For each feature that has ready tickets:**
```bash
gt agents <feature>
# Shows agent status: idle, working, etc.
```

**2. Count available capacity:**
Available agents are those that:
- Exist in the feature's agent pool
- Currently idle (no hooked work)
- Session is running

**3. Calculate dispatch count:**
```
dispatch_count = min(ready_tickets, available_agents)
```

If dispatch_count = 0:
- Log: "No capacity available, will retry next cycle"
- Proceed to report step (no dispatches to make)

**4. Match tickets to features:**
For each ready ticket, determine target feature from ticket prefix:
- gt-* tickets → gastown feature
- bd-* tickets → tickets feature
- etc.

**Exit criteria:** Dispatch plan created with ticket→feature mappings."""

[[steps]]
id = "dispatch-work"
title = "Dispatch ready tickets to agents"
needs = ["check-capacity"]
description = """
Sling each ready ticket to an available agent.

**For each ticket in dispatch plan:**

```bash
# Dispatch ticket to the appropriate feature
# This spawns a fresh agent or assigns to idle one
gt sling <ticket-id> <feature>

# Example:
gt sling gt-abc123 gastown
gt sling bd-xyz789 tickets
```

**Track results:**
For each dispatch:
- Success: Note ticket ID, target feature, agent assigned
- Failure: Note ticket ID, error message

**Important notes:**
- `gt sling` handles agent selection automatically
- It will spawn a new agent if none available
- The agent gets the ticket hooked and starts immediately
- Don't wait for agent to complete - fire and forget

**If sling fails:**
- Continue with remaining tickets
- Note the failure for the report
- Don't escalate individual failures (will retry next cycle)

**Exit criteria:** All dispatchable tickets have been slung."""

[[steps]]
id = "report-results"
title = "Generate and send feeding report"
needs = ["dispatch-work"]
description = """
Create summary report of convoy feeding actions.

**1. Generate report:**
```markdown
## Convoy Feed Report: {{convoy}}

**Ready tickets found**: {{ready_count}}
**Agents available**: {{available_count}}
**Tickets dispatched**: {{dispatch_count}}

### Dispatched Work
{{#each dispatched}}
- {{ticket_id}}: {{title}} → {{feature}}/{{agent}}
{{/each}}

### Skipped (no capacity)
{{#if skipped}}
{{#each skipped}}
- {{ticket_id}}: {{title}} (will retry next cycle)
{{/each}}
{{else}}
(none)
{{/if}}

### Errors
{{#if errors}}
{{#each errors}}
- {{ticket_id}}: {{error}}
{{/each}}
{{else}}
(none)
{{/if}}
```

**2. Send to Senior Engineer:**
```bash
gt mail send senior engineer/ -s "Convoy fed: {{convoy}}" -m "$(cat <<EOF
Convoy {{convoy}} feeding complete.

Dispatched: {{dispatch_count}}/{{ready_count}} tickets
{{#if errors}}Errors: {{error_count}}{{/if}}

{{report_summary}}
EOF
)"
```

**3. Update convoy (optional):**
If convoy has a notify field, could add a note about feeding activity.
Not required - the dispatch tracking handles visibility.

**Exit criteria:** Report generated and sent."""

[[steps]]
id = "return-to-kennel"
title = "Signal completion and return to kennel"
needs = ["report-results"]
description = """
Signal work complete and return to available pool.

**1. Signal completion to Senior Engineer:**
```bash
gt mail send senior engineer/ -s "DOG_DONE $(hostname)" -m "Task: convoy-feed
Convoy: {{convoy}}
Ready: {{ready_count}}
Dispatched: {{dispatch_count}}
Status: COMPLETE

Ready for next assignment."
```

**2. Return to kennel:**
Dog returns to available state in the pool. Senior Engineer will assign next work
or retire the dog if pool is oversized.

**Exit criteria:** Senior Engineer notified, dog ready for next work or retirement."""

[vars]
[vars.convoy]
description = "The convoy ID to feed"
required = true

[vars.available_count]
description = "Number of available agents (computed during execution)"
default = ""

[vars.dispatch_count]
description = "Number of tickets dispatched (computed during execution)"
default = ""

[vars.error]
description = "Error message for a failed dispatch (computed during execution)"
default = ""

[vars.error_count]
description = "Number of dispatch errors (computed during execution)"
default = ""

[vars.ticket_id]
description = "Ticket ID being dispatched (computed during execution)"
default = ""

[vars.agent]
description = "Agent assigned to work (computed during execution)"
default = ""

[vars.ready_count]
description = "Number of ready tickets found (computed during execution)"
default = ""

[vars.report_summary]
description = "Summary text for the feeding report (computed during execution)"
default = ""

[vars.feature]
description = "Target feature for dispatch (computed during execution)"
default = ""

[vars.title]
description = "Ticket title (computed during execution)"
default = ""
