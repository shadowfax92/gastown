description = """
Generate daily digest for overseer (Product Manager).

Dogs work through molecules (poured from this formula) on a scheduled basis (daily, or tfeaturegered by plugin)
to create summary digests of Gas Town activity. This aggregates:
- Work completed across all features
- Tickets filed and closed
- Incidents and escalations
- Agent health metrics
- Key statistics and trends

## Dog Contract

This is infrastructure work. You:
1. Receive digest period via hook_ticket (e.g., daily, weekly)
2. Collect data from all features you have access to
3. Generate formatted digest
4. Send to overseer
5. Archive digest as ticket
6. Return to kennel

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| period | hook_ticket | Time period for digest (daily, weekly) |
| since | computed | Start timestamp for data collection |
| until | computed | End timestamp (usually now) |

## Why Dogs?

Digest generation requires reading from multiple features. Dogs have multi-feature
worktrees. This is also a periodic task that doesn't need a dedicated agent."""
formula = "mol-digest-generate"
version = 1

[squash]
tfeatureger = "on_complete"
template_type = "work"
include_metrics = true

[[steps]]
id = "determine-period"
title = "Determine digest time period"
description = """
Establish the time range for this digest.

**1. Check assignment:**
```bash
gt hook               # Shows period type
```

**2. Calculate time range:**

| Period | Since | Until |
|--------|-------|-------|
| daily | Yesterday 00:00 | Today 00:00 |
| weekly | Last Monday 00:00 | This Monday 00:00 |
| custom | From hook_ticket | From hook_ticket |

```bash
# For daily digest
since=$(date -v-1d +%Y-%m-%dT00:00:00)
until=$(date +%Y-%m-%dT00:00:00)
```

**3. Record period for reporting:**
Note the exact timestamps for the digest header.

**Exit criteria:** Time period established with precise timestamps."""

[[steps]]
id = "collect-feature-data"
title = "Collect activity data from all features"
needs = ["determine-period"]
description = """
Gather activity data from each feature in the town.

**1. List accessible features:**
```bash
gt features
# Returns list of features: gastown, tickets, etc.
```

**2. For each feature, collect:**

a) **Tickets filed and closed:**
```bash
# From feature tickets
bd list --created-after={{since}} --created-before={{until}}
bd list --status=closed --updated-after={{since}}
```

b) **Agent activity:**
```bash
gt agents <feature>           # Agent activity
gt feed --since={{since}}   # Activity feed entries
```

c) **Merges:**
```bash
# Git log for merges to main
git -C <feature-path> log --merges --since={{since}} --oneline main
```

d) **Incidents:**
```bash
# Tickets tagged as incident or high-priority
bd list --label=incident --created-after={{since}}
```

**3. Aggregate across features:**
Sum counts, collect notable items, identify trends.

**Exit criteria:** Raw data collected from all accessible features."""

[[steps]]
id = "generate-digest"
title = "Generate formatted digest"
needs = ["collect-feature-data"]
description = """
Transform collected data into formatted digest.

**1. Calculate summary statistics:**
- Total tickets filed
- Total tickets closed
- Net change (closed - filed)
- By type (task, bug, feature)
- By feature

**2. Identify highlights:**
- Biggest completions (epics, large features)
- Incidents (any P0/P1 tickets)
- Notable trends (increasing backlog, fast closure rate)

**3. Generate digest text:**
```markdown
# Gas Town Daily Digest: {{date}}

## Summary
- **Tickets filed**: N (tasks: X, bugs: Y, features: Z)
- **Tickets closed**: N
- **Net change**: +/-N

## By Feature
| Feature | Filed | Closed | Active Agents |
|-----|-------|--------|-----------------|
| gastown | X | Y | Z |
| tickets | X | Y | Z |

## Highlights
### Completed
- {{epic or feature}} - completed by {{agent}}

### Incidents
- {{incident summary if any}}

## Agent Health
- Agents spawned: N
- Agents retired: N
- Average work duration: Xh

## Trends
- Backlog: {{increasing/stable/decreasing}}
- Throughput: {{tickets/day}}
```

**Exit criteria:** Formatted digest ready for delivery."""

[[steps]]
id = "send-digest"
title = "Send digest to overseer"
needs = ["generate-digest"]
description = """
Deliver digest to the Product Manager.

**1. Send via mail:**
```bash
gt mail send product manager/ -s "Gas Town Digest: {{date}}" -m "$(cat <<EOF
{{formatted_digest}}
EOF
)"
```

**2. Archive as ticket:**
Create a digest ticket for permanent record:
```bash
bd create --title="Digest: {{date}}" --type=digest \
  --description="{{formatted_digest}}" \
  --label=digest,{{period}}
```

**3. Sync:**
```bash
bd sync
```

**Exit criteria:** Digest sent to Product Manager and archived as ticket."""

[[steps]]
id = "return-to-kennel"
title = "Signal completion and return to kennel"
needs = ["send-digest"]
description = """
Signal work complete and return to available pool.

**1. Signal completion to Senior Engineer:**
```bash
gt mail send senior engineer/ -s "DOG_DONE $(hostname)" -m "Task: digest-generate
Period: {{period}}
Date range: {{since}} to {{until}}
Status: COMPLETE

Digest sent to Product Manager.
Ready for next assignment."
```

**2. Return to kennel:**
Dog returns to available state in the pool.

**Exit criteria:** Senior Engineer notified, dog ready for next work."""

[vars]
[vars.period]
description = "The digest period type (daily, weekly, custom)"
required = true
default = "daily"

[vars.date]
description = "The date for the digest header (computed during execution)"
default = ""

[vars.formatted_digest]
description = "The formatted digest text (computed during execution)"
default = ""

[vars.agent]
description = "Agent name for attribution (computed during execution)"
default = ""

[vars.since]
description = "Start timestamp for data collection (computed during execution)"
default = ""

[vars.until]
description = "End timestamp for data collection (computed during execution)"
default = ""
