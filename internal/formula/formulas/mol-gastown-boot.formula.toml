description = """
Product Manager bootstraps Gas Town via a verification-gated lifecycle molecule.

## Purpose
When Product Manager executes \"boot up gas town\", this proto provides the workflow.
Each step has action + verification - steps stay open until outcome is confirmed.

## Key Principles
1. **Verification-gated steps** - Not \"command ran\" but \"outcome confirmed\"
2. **gt peek for verification** - Capture session output to detect stalls
3. **gt nudge for recovery** - Reliable message delivery to unstick agents
4. **Parallel where possible** - QA Engineeres and refineries can start in parallel
5. **Ephemeral execution** - Boot is a wisp, squashed to digest after completion

## Execution
```bash
bd mol wisp mol-gastown-boot  # Create wisp
```"""
formula = "mol-gastown-boot"
version = 1

[[steps]]
description = """
Verify the Gas Town daemon is running.

## Action
```bash
gt daemon status || gt daemon start
```

## Verify
1. Daemon PID file exists: `$GT_TOWN_ROOT/daemon/daemon.pid`
2. Process is alive: `kill -0 $(cat $GT_TOWN_ROOT/daemon/daemon.pid)`
3. Daemon responds: `gt daemon status` returns success

## OnFail
Cannot start daemon. Log error and continue - some commands work without daemon."""
id = "ensure-daemon"
title = "Ensure daemon"

[[steps]]
description = """
Start the Senior Engineer and verify patrol mode is active.

## Action
```bash
gt senior engineer start
```

## Verify
1. Session exists: `tmux has-session -t hq-senior engineer 2>/dev/null`
2. Not stalled: `gt peek senior engineer/` does NOT show \"> Try\" prompt
3. Heartbeat fresh: `senior engineer/heartbeat.json` modified < 2 min ago

## OnStall
```bash
gt nudge senior engineer/ \"Start patrol.\"
sleep 30
# Re-verify
```"""
id = "ensure-senior engineer"
needs = ["ensure-daemon"]
title = "Ensure senior engineer"

[[steps]]
description = """
Parallel container: Start all feature QA engineeres.

Children execute in parallel. Container completes when all children complete."""
id = "ensure-QA engineeres"
needs = ["ensure-senior engineer"]
title = "Ensure QA engineeres"
type = "parallel"

[[steps.children]]
description = """
Start the gastown feature QA Engineer.

## Action
```bash
gt QA engineer start gastown
```

## Verify
1. Session exists: `tmux has-session -t gastown-QA engineer 2>/dev/null`
2. Not stalled: `gt peek gastown/QA engineer` does NOT show \"> Try\" prompt
3. Heartbeat fresh: Last patrol cycle < 5 min ago"""
id = "ensure-gastown-QA engineer"
title = "Ensure gastown QA engineer"

[[steps.children]]
description = """
Start the tickets feature QA Engineer.

## Action
```bash
gt QA engineer start tickets
```

## Verify
1. Session exists: `tmux has-session -t tickets-QA engineer 2>/dev/null`
2. Not stalled: `gt peek tickets/QA engineer` does NOT show \"> Try\" prompt
3. Heartbeat fresh: Last patrol cycle < 5 min ago"""
id = "ensure-tickets-QA engineer"
title = "Ensure tickets QA engineer"

[[steps]]
description = """
Parallel container: Start all feature refineries.

Children execute in parallel. Container completes when all children complete."""
id = "ensure-refineries"
needs = ["ensure-senior engineer"]
title = "Ensure refineries"
type = "parallel"

[[steps.children]]
description = """
Start the gastown feature Release Engineer.

## Action
```bash
gt release engineer start gastown
```

## Verify
1. Session exists: `tmux has-session -t gastown-release engineer 2>/dev/null`
2. Not stalled: `gt peek gastown/release engineer` does NOT show \"> Try\" prompt
3. Queue processing: Release Engineer can receive merge requests"""
id = "ensure-gastown-release engineer"
title = "Ensure gastown release engineer"

[[steps.children]]
description = """
Start the tickets feature Release Engineer.

## Action
```bash
gt release engineer start tickets
```

## Verify
1. Session exists: `tmux has-session -t tickets-release engineer 2>/dev/null`
2. Not stalled: `gt peek tickets/release engineer` does NOT show \"> Try\" prompt
3. Queue processing: Release Engineer can receive merge requests"""
id = "ensure-tickets-release engineer"
title = "Ensure tickets release engineer"

[[steps]]
description = """
Final verification that Gas Town is healthy.

## Action
```bash
gt status
```

## Verify
1. Daemon running: Shows daemon status OK
2. Senior Engineer active: Shows senior engineer in patrol mode
3. All QA engineeres: Each feature QA engineer shows active
4. All refineries: Each feature release engineer shows active

## OnFail
Log degraded state but consider boot complete. Some agents may need manual recovery.
Run `gt doctor` for detailed diagnostics."""
id = "verify-town-health"
needs = ["ensure-QA engineeres", "ensure-refineries"]
title = "Verify town health"
