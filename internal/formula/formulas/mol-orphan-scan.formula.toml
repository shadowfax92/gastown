description = """
Find and reassign orphaned work.

Dogs work through molecules (poured from this formula) to scan for orphaned state:
- Tickets marked in_progress with no active agent
- Molecules attached but worker gone
- Merge queue entries with dead owners
- Wisps from terminated sessions

This is a cleanup and recovery formula. Found orphans are either:
- Reassigned to available workers
- Reset to open status for next dispatch
- Escalated if data loss occurred

## Dog Contract

This is infrastructure work. You:
1. Receive scan scope via hook_ticket (feature or town-wide)
2. Scan for orphaned state
3. Classify and triage orphans
4. Take recovery action
5. Report findings
6. Return to kennel

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| scope | hook_ticket | Scan scope: 'town' or specific feature name |

## Why Dogs?

Orphan scanning requires multi-feature access and may need to interact with
multiple QA Engineeres. Dogs have the cross-feature worktrees needed for this."""
formula = "mol-orphan-scan"
version = 2

[squash]
tfeatureger = "on_complete"
template_type = "work"
include_metrics = true

[[steps]]
id = "determine-scope"
title = "Determine scan scope"
description = """
Establish what to scan for orphans.

**1. Check assignment:**
```bash
gt hook               # Shows scope in hook_ticket
```

**2. Resolve scope:**
- 'town': Scan all features
- '<feature>': Scan specific feature only

```bash
# If town-wide
gt features                     # Get list of all features

# If specific feature
# Just use that feature
```

**Exit criteria:** Scope determined, feature list established."""

[[steps]]
id = "scan-orphaned-tickets"
title = "Scan for orphaned tickets"
needs = ["determine-scope"]
description = """
Find tickets marked in_progress with no active worker.

**1. For each feature in scope, find in_progress tickets:**
```bash
bd list --status=in_progress
```

**2. For each in_progress ticket, check assignee:**
```bash
bd show <ticket-id>
# Get assignee field
```

**3. Check if assignee session exists:**

Parse the assignee field to extract feature and agent name:
- Assignee format: `<feature>/agents/<name>` (e.g., `nrpk/agents/rust`)
- Extract: feature and name from the path

```bash
# Check session liveness using gt session status (handles prefix derivation)
gt session status <feature>/<name> --json | jq -r '.running' | grep -q true && echo ALIVE || echo DEAD
```

If the assignee is NOT a agent (e.g., QA engineer, release engineer), use:
```bash
gt session status <feature>/<role> --json | jq -r '.running' | grep -q true && echo ALIVE || echo DEAD
```

**4. Identify orphans:**
- Ticket in_progress + assignee session dead = orphan
- Ticket in_progress + no assignee = orphan

Record each orphan with:
- Ticket ID
- Last assignee (if any)
- How long orphaned (last update timestamp)

**Exit criteria:** Orphaned tickets identified."""

[[steps]]
id = "scan-orphaned-molecules"
title = "Scan for orphaned molecules"
needs = ["determine-scope"]
description = """
Find molecules attached to dead sessions.

**1. List active molecules:**
```bash
bd mol list --active
```

**2. For each molecule, check owner session:**
```bash
bd mol show <mol-id>
# Get agent/session info
```

**3. Check if owner session exists:**

Parse the owner/agent field to extract feature and name:
- Owner format: `<feature>/agents/<name>` or `<feature>/<role>`

```bash
# Check session liveness using gt session status (handles prefix derivation)
gt session status <feature>/<name> --json | jq -r '.running' | grep -q true && echo ALIVE || echo DEAD
```

**4. Identify orphans:**
- Molecule in_progress + owner session dead = orphan
- Molecule hooked + owner session dead = orphan

Record each orphan for triage.

**Exit criteria:** Orphaned molecules identified."""

[[steps]]
id = "scan-orphaned-wisps"
title = "Scan for orphaned wisps"
needs = ["determine-scope"]
description = """
Find wisps from terminated sessions.

**1. List wisps in ephemeral storage:**
```bash
ls .tickets-wisp/             # Or equivalent location
```

**2. For each wisp, check spawner session:**
Wisps should have metadata indicating the spawning session.

**3. Identify orphans:**
- Wisp age > 1 hour + spawner session dead = orphan
- Wisp with no spawner metadata = orphan

**4. Check for unsquashed content:**
Orphaned wisps may have audit-worthy content that wasn't squashed.

**Exit criteria:** Orphaned wisps identified."""

[[steps]]
id = "triage-orphans"
title = "Classify and triage orphans"
needs = ["scan-orphaned-tickets", "scan-orphaned-molecules", "scan-orphaned-wisps"]
description = """
Classify orphans by severity and determine action.

**1. Classify by type:**

| Type | Severity | Typical Action |
|------|----------|----------------|
| Ticket in_progress, no work done | Low | Reset to open |
| Ticket in_progress, work in progress | Medium | Check branch, reassign |
| Molecule mid-execution | Medium | Resume or restart |
| Wisp with content | Low | Squash or burn |
| Wisp empty | None | Delete |

**2. Check for data loss:**
For tickets/molecules with possible work:
```bash
# Check for branch with work
git branch -a | grep <agent-or-ticket>
git log --oneline <branch>
```

**3. Categorize for action:**
- RESET: Return to open status for normal dispatch
- REASSIGN: Assign to specific worker immediately
- RECOVER: Salvage work from branch/state
- ESCALATE: Data loss or complex situation
- BURN: Safe to delete (empty wisps, etc.)

**Exit criteria:** All orphans categorized with planned action."""

[[steps]]
id = "execute-recovery"
title = "Execute recovery actions"
needs = ["triage-orphans"]
description = """
Take action on each orphan based on triage.

**1. RESET orphans:**
```bash
bd update <ticket> --status=open --assignee=""
# Clears in_progress, ready for dispatch
```

**2. REASSIGN orphans:**
```bash
# Notify QA Engineer to handle assignment
gt mail send <feature>/QA engineer -s "Orphan needs assignment: <ticket>" \
  -m "Ticket <id> was orphaned. Has partial work. Needs reassignment."
```

**3. RECOVER orphans:**
```bash
# For tickets with work on branch:
# - Preserve the branch
# - Create recovery note
bd update <ticket> --status=open \
  --note="Recovery: work exists on branch <branch>"
```

**4. ESCALATE orphans:**
```bash
gt mail send product manager/ -s "Orphan requires escalation: <ticket>" \
  -m "Ticket <id> orphaned with possible data loss.
Details: ...
Recommended action: ..."
```

**5. BURN orphans:**
```bash
# For empty wisps, etc.
rm .tickets-wisp/<wisp-file>
```

**Exit criteria:** All orphans handled."""

[[steps]]
id = "report-findings"
title = "Generate and send orphan report"
needs = ["execute-recovery"]
description = """
Create summary report of orphan scan and actions.

**1. Generate report:**
```markdown
## Orphan Scan Report: {{timestamp}}

**Scope**: {{scope}}
**Orphans found**: {{total_count}}

### By Type
- Tickets: {{ticket_count}}
- Molecules: {{mol_count}}
- Wisps: {{wisp_count}}

### Actions Taken
- Reset to open: {{reset_count}}
- Reassigned: {{reassign_count}}
- Recovered: {{recover_count}}
- Escalated: {{escalate_count}}
- Burned: {{burn_count}}

### Details
{{#each orphan}}
- {{type}} {{id}}: {{action}} - {{reason}}
{{/each}}
```

**2. Send to Senior Engineer (for logs):**
```bash
gt mail send senior engineer/ -s "Orphan scan complete: {{total_count}} found" \
  -m "{{report}}"
```

**3. Send to Product Manager (if escalations):**
```bash
# Only if there were escalations
gt mail send product manager/ -s "Orphan scan: {{escalate_count}} escalations" \
  -m "{{escalations_section}}"
```

**Exit criteria:** Reports sent."""

[[steps]]
id = "return-to-kennel"
title = "Signal completion and return to kennel"
needs = ["report-findings"]
description = """
Signal work complete and return to available pool.

**1. Signal completion to Senior Engineer:**
```bash
gt mail send senior engineer/ -s "DOG_DONE $(hostname)" -m "Task: orphan-scan
Scope: {{scope}}
Orphans found: {{total_count}}
Actions taken: {{action_summary}}
Status: COMPLETE

Ready for next assignment."
```

**2. Return to kennel:**
Dog returns to available state in the pool.

**Exit criteria:** Senior Engineer notified, dog ready for next work."""

[vars]
[vars.scope]
description = "Scan scope: 'town' or specific feature name"
required = true
default = "town"

[vars.action]
description = "Recovery action taken for an orphan (computed during execution)"
default = ""

[vars.action_summary]
description = "Summary of all actions taken (computed during execution)"
default = ""

[vars.burn_count]
description = "Number of orphans burned/deleted (computed during execution)"
default = ""

[vars.escalate_count]
description = "Number of orphans escalated (computed during execution)"
default = ""

[vars.escalations_section]
description = "Formatted escalations section for Product Manager report (computed during execution)"
default = ""

[vars.id]
description = "Orphan identifier (computed during execution)"
default = ""

[vars.ticket_count]
description = "Number of orphaned tickets found (computed during execution)"
default = ""

[vars.mol_count]
description = "Number of orphaned molecules found (computed during execution)"
default = ""

[vars.reason]
description = "Reason for orphan cleanup action (computed during execution)"
default = ""

[vars.reassign_count]
description = "Number of orphans reassigned (computed during execution)"
default = ""

[vars.recover_count]
description = "Number of orphans recovered (computed during execution)"
default = ""

[vars.report]
description = "Full orphan scan report text (computed during execution)"
default = ""

[vars.reset_count]
description = "Number of orphans reset to open (computed during execution)"
default = ""

[vars.timestamp]
description = "Timestamp of the scan (computed during execution)"
default = ""

[vars.total_count]
description = "Total number of orphans found (computed during execution)"
default = ""

[vars.type]
description = "Type of orphan (ticket, molecule, wisp) (computed during execution)"
default = ""

[vars.wisp_count]
description = "Number of orphaned wisps found (computed during execution)"
default = ""
