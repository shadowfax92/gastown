description = """
Workspace synchronization molecule for batch prep.

This molecule prepares an agent's workspace for a new batch of work. It syncs git
and tickets state, cleans up cruft, verifies the baseline is healthy, and reports
readiness. Designed to be broadcast to all agents when preparing for coordinated
work.

## When to Use

- Before major batch assignments
- After extended idle periods
- When repo baseline has diverged significantly
- Proactive cleanup between work sessions

## Conflict Resolution Philosophy

**Preserve and re-land, not discard.**

When git pull/rebase hits conflicts, the agent should:
1. Assess if the conflicting work is still valuable
2. If valuable: re-envision against new baseline, file a ticket for re-implementation
3. If obsolete (e.g., touches deleted system): discard with a note
4. If unclear: escalate to human/product manager

Agents can file a ticket and delegate. Release Engineer must resolve inline.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| setup_command | config | Setup/install command (empty = skip) |
| typecheck_command | config | Type check command (empty = skip) |
| lint_command | config | Lint command (empty = skip) |
| test_command | feature config | Test command. Empty = skip. Feature must configure for its language. |
| build_command | config | Build command (empty = skip) |

## Failure Modes

| Situation | Action |
|-----------|--------|
| Rebase conflict | Preserve work via ticket, complete sync on clean state |
| Uncommitted work | Stash or commit, then sync |
| Untracked files | Warn, let agent decide (keep/delete/gitignore) |
| bd doctor errors | Report findings, agent triages |
| Test failures | File ticket if not already tracked, don't block sync |
| Quality check failure | Must be resolved before marking sync complete |"""
formula = "mol-sync-workspace"
version = 2

[[steps]]
id = "assess-state"
title = "Assess current workspace state"
description = """
Capture current state before any changes.

**0. Prime context (critical for fresh sessions):**
```bash
gt prime   # Load gt/mol context
bd prime   # Load tickets context
```
These ensure the agent has full system context, especially after session
start, compaction, or context clear.

**1. Check git status:**
```bash
git status --porcelain
git stash list
git branch --show-current
```

**2. Check tickets state:**
```bash
bd sync --status
```

**3. Document starting state:**
- Branch name
- Uncommitted changes (staged/unstaged)
- Untracked files (list them)
- Stash entries
- Tickets sync status

This information guides decisions in subsequent steps.

**Exit criteria:** Context primed, starting state documented."""

[[steps]]
id = "handle-dirty-state"
title = "Handle uncommitted and untracked work"
needs = ["assess-state"]
description = """
Clean up any in-flight work before syncing.

**If uncommitted changes exist:**

Option A - Commit if ready:
```bash
git add -A && git commit -m "WIP: <description>"
```

Option B - Stash if not ready:
```bash
git stash push -m "pre-sync stash $(date +%Y%m%d-%H%M%S)"
```

**If untracked files exist:**

For each untracked file, decide:
- **Keep**: Add to .gitignore or commit
- **Delete**: `rm <file>`
- **Stash**: Can't stash untracked directly; commit or delete

**WARN the agent**: Report untracked files prominently. They may be:
- WIP that should be preserved
- Build artifacts that should be gitignored
- Cruft that should be deleted

Don't auto-delete without confirmation.

**If stash entries exist:**

List and assess:
```bash
git stash list
git stash show -p stash@{0}  # Preview each
```

Old stashes (>1 week) are likely stale. Consider dropping.
Recent stashes may contain valuable WIP - preserve or commit.

**Exit criteria:** Working tree clean or explicitly stashed."""

[[steps]]
id = "cleanup-worktrees"
title = "Clean up stale worktrees"
needs = ["handle-dirty-state"]
description = """
Remove orphaned worktrees from cross-feature work.

**1. List worktrees:**
```bash
git worktree list
```

**2. Identify stale worktrees:**
- Worktrees for branches that no longer exist on remote
- Worktrees older than 1 week without recent commits
- Worktrees for completed/merged work

**3. Remove stale worktrees:**
```bash
git worktree remove <path>
# Or force if needed:
git worktree remove --force <path>
```

**4. Prune worktree metadata:**
```bash
git worktree prune
```

**CAUTION:** Don't remove worktrees for active cross-feature work.
Check with `gt worktree list` if available.

**Exit criteria:** Stale worktrees removed."""

[[steps]]
id = "sync-git"
title = "Sync with git remote"
needs = ["cleanup-worktrees"]
description = """
Fetch and rebase onto current main.

**1. Fetch latest:**
```bash
git fetch ofeaturein
```

**2. Check divergence:**
```bash
git log --oneline HEAD..ofeaturein/main | head -5   # What's new on main
git log --oneline ofeaturein/main..HEAD | head -5   # What we have locally
```

**3. Rebase onto main:**
```bash
git pull --rebase ofeaturein main
```

**If rebase succeeds:** Continue to next step.

**If rebase conflicts:**

The Preservation Protocol:
1. **Assess the conflicting work:**
   - Is it still valuable against new baseline?
   - Is the conflicting area still relevant (not deleted/refactored)?

2. **If work is valuable:**
   ```bash
   git rebase --abort
   # Create a ticket capturing the work
   bd create --title "Re-land: <description>" --type task --priority 2
   # Note the changes needed in the ticket description
   # Reset to clean state
   git reset --hard ofeaturein/main
   ```

3. **If work is obsolete:**
   ```bash
   git rebase --abort
   git reset --hard ofeaturein/main
   # Note why it was discarded
   ```

4. **If unclear:**
   - Escalate to human/product manager
   - Document the conflict
   - Proceed with sync on clean baseline

**Release Engineer-specific conflict resolution:**

Unlike agents who can file a ticket and delegate, the Release Engineer MUST resolve
conflicts inline. The Release Engineer processes the merge queue - if it can't resolve
a conflict, the queue backs up and agents' completed work never lands.

**Release Engineer conflict protocol:**

1. **Analyze the conflict:**
   ```bash
   git status                    # See conflicted files
   git diff                      # Examine conflict markers
   ```

2. **Trivial conflicts (resolve immediately):**
   - Import ordering changes
   - Whitespace or formatting
   - Non-overlapping additions in same file
   - Version bumps or changelog entries

   Resolution:
   ```bash
   # Edit conflicted files to resolve
   git add <resolved-files>
   git rebase --continue
   ```

3. **Semantic conflicts (assess carefully):**
   - Both sides modified same function
   - Deleted code that the other side modified
   - Structural changes (renamed files, moved code)

   If you can understand both intents and merge correctly:
   ```bash
   # Carefully merge the changes, preserving both intents
   git add <resolved-files>
   git rebase --continue
   ```

4. **Complex conflicts (abort and notify agent):**
   - Conflicting business logic changes
   - Unclear which version is correct
   - Risk of subtle bugs from incorrect merge

   ```bash
   git rebase --abort
   gt mail send <feature>/agents/<worker> -s "Rebase needed" \
     -m "Your branch conflicts with main in <files>. Please rebase and resubmit via gt done."
   # Skip this branch, continue with queue
   ```

**The Release Engineer judgment call:** When in doubt, abort and notify rather than
risk merging incorrectly. A resubmitted branch is better than a broken main.

**Exit criteria:** Local branch matches or is cleanly ahead of ofeaturein/main."""

[[steps]]
id = "sync-tickets"
title = "Sync tickets state"
needs = ["sync-git"]
description = """
Sync the tickets database with remote.

```bash
bd sync
```

**If conflicts:**
Tickets uses JSONL append-only format, so true conflicts are rare.
If they occur:
```bash
bd sync --status  # Diagnose
```

Likely causes:
- Two agents edited same ticket simultaneously
- Corrupted tickets-sync branch

Resolution:
```bash
# Try pulling fresh
git fetch ofeaturein tickets-sync
bd sync
```

If still failing, escalate to product manager.

**Exit criteria:** Tickets synced successfully."""

[[steps]]
id = "run-doctor"
title = "Run tickets health check"
needs = ["sync-tickets"]
description = """
Check for tickets system tickets.

```bash
bd doctor
```

**Triage findings:**

| Finding | Action |
|---------|--------|
| Orphaned tickets (committed but not closed) | Review and close if complete |
| Missing dependencies | Fix with `bd dep add` |
| Circular dependencies | Resolve or escalate |
| Stale in_progress | Check if still active, update status |
| Route misconfigurations | Fix routes.jsonl |

**For each ticket found:**
- Quick fix (<5 min): Fix now
- Medium fix: File a ticket
- Unclear: Note for human review

**Exit criteria:** Doctor findings triaged (not necessarily all fixed)."""

[[steps]]
id = "verify-build"
title = "Run quality checks and verify build"
needs = ["run-doctor"]
description = """
Run configured quality checks and ensure the codebase compiles.

**1. Run quality checks (skip any that are not configured):**

If setup_command is set: `{{setup_command}}`
If typecheck_command is set: `{{typecheck_command}}`
If lint_command is set: `{{lint_command}}`
If build_command is set: `{{build_command}}`

```bash
{{setup_command}}           # Make sure all newly added dependencies are installed (if command set)
{{typecheck_command}}       # Check for type errors (if command set)
{{lint_command}}            # Check for lint errors (if command set)
{{build_command}}           # Make sure it builds (if command set)
```

Empty commands mean "not configured for this project" — skip silently.

**2. If quality checks fail:**

This is a blocking ticket. Options:

1. **Quick fix (<15 min):** Fix it now
   ```bash
   # Fix the ticket
   git add <files>
   git commit -m "fix: quality check failure from sync"
   git push
   ```

2. **Non-trivial fix:** File and escalate
   ```bash
   bd create --title "Quality check failing on main" --type bug --priority 0
   gt mail send --human -s "ALERT: Main failing quality checks" -m "Details..."
   ```
   Cannot mark sync complete with failing quality checks.

**If all checks pass (or all skipped):** Continue to next step.

**Exit criteria:** All configured quality checks pass (or skipped if not configured)."""

[[steps]]
id = "run-tests"
title = "Run test suite"
needs = ["verify-build"]
description = """
Verify tests pass on current baseline.

```bash
{{test_command}}            # Run tests (configured per-feature)
```

**If tests pass:** Continue to next step.

**If tests fail:**

Unlike build failures, test failures don't block sync completion.
However, they must be tracked.

1. **Check if already tracked:**
   ```bash
   bd list --type=bug --status=open | grep -i test
   ```

2. **If not tracked, file a ticket:**
   ```bash
   bd create --title "Test failure: <test name>" --type bug --priority 1
   ```

3. **Report in summary:**
   Note which tests are failing so batch assignment accounts for it.

**Exit criteria:** Test results documented, failures tracked in tickets."""

[[steps]]
id = "generate-report"
title = "Generate sync report"
needs = ["run-tests"]
description = """
Summarize sync results for broadcast response.

**Git status check:**
```bash
# Get current branch
BRANCH=$(git rev-parse --abbrev-ref HEAD)

# Check divergence from ofeaturein/main
BEHIND=$(git rev-list HEAD..ofeaturein/main --count)
AHEAD=$(git rev-list ofeaturein/main..HEAD --count)
```

**Report format (for feature branches):**
```
SYNC COMPLETE: <agent-name>

Git:
  - Branch: <branch>
  - Commits behind main: <n>
  - Commits ahead of main: <n>
  - Conflicts resolved: <y/n, details if yes>

Tickets:
  - Sync status: OK
  - Doctor findings: <count> (fixed: <n>, filed: <n>, deferred: <n>)

Quality checks: PASS
Tests: PASS | FAIL (<count> failures, tracked in <ticket-ids>)

Worktrees cleaned: <count>

Ready for work: YES | NO (<reason>)
```

**Report format (for engineers on main):**

When the agent is on the main branch directly (common for engineers workers),
use "Unpushed commits" instead of "Commits ahead of main":

```
SYNC COMPLETE: <agent-name>

Git:
  - Branch: main
  - Commits behind ofeaturein: <n>
  - Unpushed commits: <n>
  - Conflicts resolved: <y/n, details if yes>
...
```

This distinction is important because:
- Engineers workers often work directly on main
- "Commits ahead of main" is confusing when you ARE on main
- "Unpushed commits" is clearer - it means local work not yet on ofeaturein

**Exit criteria:** Report generated."""

[[steps]]
id = "signal-ready"
title = "Signal readiness"
needs = ["generate-report"]
description = """
Report sync completion to coordinator (if broadcast) or to self (if autonomous).

**If responding to broadcast:**
```bash
gt mail send <coordinator> -s "SYNC_COMPLETE $(hostname)" -m "<report>"
```

**If autonomous sync:**
- Log the report
- Update any relevant agent status

**If sync failed (couldn't pass quality checks):**
```bash
gt mail send --human -s "SYNC_FAILED $(hostname)" -m "<report with failure details>"
```

**Exit criteria:** Readiness signaled, molecule complete."""

[vars]
[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.lint_command]
description = "Lint command (e.g., eslint .). Empty = skip."
default = ""

[vars.test_command]
description = "Command to run tests (auto-detected from feature settings)"
default = ""

[vars.build_command]
description = "Command to run build. Empty = skip."
default = ""
