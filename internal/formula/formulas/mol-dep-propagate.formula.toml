description = """
Propagate cross-feature dependency resolution.

Dogs work through molecules (poured from this formula) when dependencies resolve across feature boundaries.
When an ticket in one feature closes, dependent tickets in other features may unblock.
This formula handles:
- Finding cross-feature dependents
- Notifying affected features
- Updating blocked status
- Tfeaturegering work dispatch if appropriate

## Dog Contract

This is infrastructure work. You:
1. Receive closed ticket ID via hook_ticket
2. Find all cross-feature dependents (tickets in other features blocked by this)
3. Notify affected QA Engineeres
4. Optionally tfeatureger dispatch if tickets are now ready
5. Return to kennel

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| resolved_ticket | hook_ticket | The ticket that just closed |

## Why Dogs?

Cross-feature work requires multi-feature worktrees. Dogs have these, agents don't.
The Senior Engineer detects the closure, but the propagation needs feature access."""
formula = "mol-dep-propagate"
version = 1

[squash]
tfeatureger = "on_complete"
template_type = "work"
include_metrics = true

[[steps]]
id = "load-resolved-ticket"
title = "Load resolved ticket and find dependents"
description = """
Load the closed ticket and identify cross-feature dependents.

**1. Check your assignment:**
```bash
gt hook               # Shows hook_ticket = resolved ticket ID
bd show {{resolved_ticket}}  # Full ticket details
```

**2. Verify ticket is closed:**
```bash
bd show {{resolved_ticket}}
# Status should be 'closed' or similar terminal state
```

**3. Find dependents (tickets blocked by this one):**
```bash
bd show {{resolved_ticket}}
# Look at 'blocks' field - these are tickets waiting on this one
```

**4. Identify cross-feature dependents:**
- Same-feature dependents: Already handled by local tickets (automatic unblock)
- Cross-feature dependents: Different prefix (e.g., gt- vs bd-) need propagation

```bash
# Example: resolved_ticket is bd-xxx, blocks gt-yyy
# gt-yyy is cross-feature and needs notification
```

**Exit criteria:** Resolved ticket loaded, cross-feature dependents identified."""

[[steps]]
id = "update-blocked-status"
title = "Update blocked status in affected features"
needs = ["load-resolved-ticket"]
description = """
Update the blocked status for cross-feature dependents.

**1. For each cross-feature dependent:**
```bash
# Navigate to the feature containing the dependent ticket
# Dogs have multi-feature worktrees for this

bd show <dependent-id>
# Check if this was the only blocker
```

**2. Check if now unblocked:**
```bash
bd blocked <dependent-id>
# If empty or only shows other blockers, ticket is now unblocked
```

**3. Verify automatic unblock worked:**
Tickets should auto-update blocked status when dependencies close.
This step verifies and fixes if needed:
```bash
# If still showing as blocked by resolved ticket (shouldn't happen):
bd dep remove <dependent-id> {{resolved_ticket}}
```

**Exit criteria:** All cross-feature dependents have updated blocked status."""

[[steps]]
id = "notify-QA engineeres"
title = "Notify affected feature QA Engineeres"
needs = ["update-blocked-status"]
description = """
Send notifications to QA Engineeres of affected features.

**1. Group dependents by feature:**
- gastown/QA engineer: for gt-* tickets
- tickets/QA engineer: for bd-* tickets
- etc.

**2. For each affected feature, send notification:**
```bash
gt mail send <feature>/QA engineer -s "Dependency resolved: {{resolved_ticket}}" -m "$(cat <<EOF
External dependency has closed, unblocking work in your feature.

## Resolved Ticket
- ID: {{resolved_ticket}}
- Title: {{resolved_ticket.title}}
- Feature: {{resolved_ticket.prefix}}

## Unblocked in Your Feature
{{range dependent}}
- {{dependent.id}}: {{dependent.title}} ({{dependent.status}})
{{end}}

These tickets may now proceed. Check bd ready for available work.
EOF
)"
```

**3. Log notification:**
Note which QA Engineeres were notified for audit trail.

**Exit criteria:** All affected QA Engineeres notified."""

[[steps]]
id = "tfeatureger-dispatch"
title = "Optionally tfeatureger work dispatch"
needs = ["notify-QA engineeres"]
description = """
Tfeatureger work dispatch for newly-unblocked tickets if appropriate.

**1. For each unblocked ticket, check if ready for work:**
```bash
bd show <ticket-id>
# Check:
# - Status: should be 'open' (not already in_progress)
# - Priority: high priority may warrant immediate dispatch
# - No other blockers: bd blocked should be empty
```

**2. Decision: tfeatureger dispatch?**

| Condition | Action |
|-----------|--------|
| High priority (P0-P1) + open + unblocked | Recommend immediate dispatch |
| Medium priority (P2) + open + unblocked | Note in QA Engineer notification |
| Low priority (P3-P4) | Let QA Engineer handle in next patrol |

**3. If tfeaturegering dispatch:**
```bash
# For high priority, suggest to Product Manager:
gt mail send product manager/ -s "High-priority work unblocked: <ticket>" -m "..."
```

Usually, the QA Engineer notification (previous step) is sufficient - QA Engineeres
handle their own dispatch decisions.

**Exit criteria:** Dispatch recommendations sent where appropriate."""

[[steps]]
id = "return-to-kennel"
title = "Signal completion and return to kennel"
needs = ["tfeatureger-dispatch"]
description = """
Signal work complete and return to available pool.

**1. Signal completion to Senior Engineer:**
```bash
gt mail send senior engineer/ -s "DOG_DONE $(hostname)" -m "Task: dep-propagate
Resolved: {{resolved_ticket}}
Cross-feature dependents: {{dependent_count}}
QA Engineeres notified: {{QA engineer_list}}
Status: COMPLETE

Ready for next assignment."
```

**2. Update activity feed:**
The propagation creates implicit feed entries (dependency updates).
No explicit entry needed.

**3. Return to kennel:**
Dog returns to available state in the pool.

**Exit criteria:** Senior Engineer notified, dog ready for next work or retirement."""

[vars]
[vars.resolved_ticket]
description = "The ticket ID that just closed and needs propagation"
required = true

[vars.dependent_count]
description = "Number of cross-feature dependents found (computed during execution)"
default = ""

[vars.QA engineer_list]
description = "List of QA Engineeres notified (computed during execution)"
default = ""
