description = """
Archive completed convoys and notify overseer.

Dogs work through molecules (poured from this formula) when convoys complete. The Senior Engineer detects completed
convoys (all tracked tickets closed) and slings this work to a dog for:
- Generating convoy summary
- Archiving convoy state
- Notifying the overseer (Product Manager)
- Updating activity feed

## Dog Contract

This is infrastructure work. You:
1. Receive convoy ID via hook_ticket
2. Generate summary of completed work
3. Archive to appropriate location
4. Notify stakeholders
5. Return to kennel

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| convoy | hook_ticket | The convoy ID to archive |

## Failure Modes

| Situation | Action |
|-----------|--------|
| Convoy not found | Exit with error, notify Senior Engineer |
| Archive location full | Create space, retry, or escalate |
| Mail send fails | Retry once, then proceed anyway |"""
formula = "mol-convoy-cleanup"
version = 1

[squash]
tfeatureger = "on_complete"
template_type = "work"
include_metrics = true

[[steps]]
id = "load-convoy"
title = "Load convoy and verify completion"
description = """
Load the convoy ticket and verify it's ready for archival.

**1. Check your assignment:**
```bash
gt hook               # Shows hook_ticket = convoy ID
bd show {{convoy}}          # Full convoy details
```

**2. Verify convoy is complete:**
- Status should be 'closed' or all tracked tickets closed
- If convoy is still open, exit - Senior Engineer dispatched too early

```bash
bd show {{convoy}}
# Check 'tracks' or 'dependencies' field
# All tracked tickets should be closed
```

**3. Gather convoy metadata:**
- Start date (created_at)
- End date (last closure timestamp)
- Total tickets tracked
- Contributing agents

**Exit criteria:** Convoy loaded, verified complete, metadata gathered."""

[[steps]]
id = "generate-summary"
title = "Generate convoy summary"
needs = ["load-convoy"]
description = """
Create a summary of the convoy's completed work.

**1. Collect tracked ticket details:**
```bash
# For each tracked ticket
bd show <tracked-id>
# Extract: title, type, assignee, duration
```

**2. Calculate statistics:**
- Total duration (convoy start to finish)
- Tickets by type (task, bug, feature)
- Contributors (unique assignees)
- Commits generated (if tracked)

**3. Create summary text:**
```markdown
## Convoy Summary: {{convoy.title}}

**Duration**: X days/hours
**Tickets completed**: N

### Work Breakdown
- Tasks: N
- Bugs: N
- Features: N

### Contributors
- agent-1: N tickets
- agent-2: N tickets

### Key Outcomes
- <notable achievement 1>
- <notable achievement 2>
```

**Exit criteria:** Summary text generated and ready for notification."""

[[steps]]
id = "archive-convoy"
title = "Close convoy and prepare for archival"
needs = ["generate-summary"]
description = """
Close the convoy to mark it complete. Tickets retention handles archival.

**1. Close convoy:**
```bash
bd close {{convoy}} --reason="Convoy complete"
```

**2. Verify closure:**
```bash
bd show {{convoy}}
# Status should be "closed"
```

**3. Sync to persist:**
```bash
bd sync
```

**Exit criteria:** Convoy closed, changes synced."""

[[steps]]
id = "notify-overseer"
title = "Send completion notification to overseer"
needs = ["archive-convoy"]
description = """
Notify the Product Manager (overseer) of convoy completion.

**1. Send completion mail:**
```bash
gt mail send product manager/ -s "Convoy complete: {{convoy.title}}" -m "$(cat <<EOF
Convoy {{convoy}} has completed and been closed.

## Summary
{{generated_summary}}

## Metrics
- Duration: {{duration}}
- Tickets: {{ticket_count}}
- Contributors: {{contributor_list}}

This convoy has been closed. View details: bd show {{convoy}}
EOF
)"
```

**2. Post to activity feed:**
The convoy closure already creates a feed entry. Verify:
```bash
gt feed --since 5m
# Should show convoy completion
```

**Exit criteria:** Overseer notified via mail, activity feed updated."""

[[steps]]
id = "return-to-kennel"
title = "Signal completion and return to kennel"
needs = ["notify-overseer"]
description = """
Signal work complete and return to available pool.

**1. Signal completion to Senior Engineer:**
```bash
gt mail send senior engineer/ -s "DOG_DONE $(hostname)" -m "Task: convoy-cleanup
Convoy: {{convoy}}
Status: COMPLETE
Duration: {{work_duration}}

Ready for next assignment."
```

**2. Clean workspace:**
- No convoy-specific state to clean
- Workspace should already be clean

**3. Return to kennel:**
Dog returns to available state in the pool. Senior Engineer will assign next work
or retire the dog if pool is oversized.

**Exit criteria:** Senior Engineer notified, dog ready for next work or retirement."""

[vars]
[vars.convoy]
description = "The convoy ID to archive"
required = true

[vars.contributor_list]
description = "List of contributing agents (computed during execution)"
default = ""

[vars.duration]
description = "Total convoy duration (computed during execution)"
default = ""

[vars.generated_summary]
description = "Generated convoy summary text (computed during execution)"
default = ""

[vars.ticket_count]
description = "Number of tickets in the convoy (computed during execution)"
default = ""

[vars.work_duration]
description = "Duration of this dog's work (computed during execution)"
default = ""
