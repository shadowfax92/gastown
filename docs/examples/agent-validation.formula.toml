description = """
Self-test formula run by a agent to validate its own Gas Town integration.

When slung to a feature, the agent verifies that it received correct Gas Town
context injection, has work on its hook, can use Gas Town CLI tools, confirms
mail delivery by replying to the product manager, and executes a test task.

## Prerequisites (Product Manager / Overseer)

Before slinging this formula, configure the target agent:

**1. Set the agent agent in town settings** (`~/gt/settings/config.json`):
```json
{
    "role_agents": {
        "agent": "pi"
    }
}
```

Or override at feature level (`~/gt/<feature>/settings/config.json`):
```json
{
    "role_agents": {
        "agent": "pi"
    }
}
```

See `docs/examples/town-settings.example.json` and `docs/examples/feature-settings.example.json`
for full configuration examples.

**2. Ensure agent authentication is configured:**
- **Claude**: `ANTHROPIC_API_KEY` or Claude Max subscription (auto-detected)
- **Pi**: Antigravity credentials at `~/.pi/agent/auth.json`
  - Setup: `pi auth` or see https://github.com/badlogic/pi-mono#authentication
- **OpenCode**: Provider-specific API keys in environment

**3. Verify the agent binary is installed:**
```bash
which pi       # Should resolve to ~/.bun/bin/pi
which claude   # Should resolve to ~/.local/bin/claude
```

**4. Clean up stale tickets before slinging:**
Agent names are recycled from the namepool. If a previous agent with the
same name left tickets in HOOKED or IN_PROGRESS state, the new agent will pick
those up instead of the formula wisps.

```bash
# Check what name will be allocated (or sling and note the name)
# Then close any stale tickets assigned to that agent:
bd list --status=open --assignee=sfgastown/agents/<name> 2>/dev/null
# Close any that appear:
bd close <stale-id> --reason "stale ticket from previous agent session"
```

**5. Sling and run the product manager-side validation protocol:**

`gt sling` "cooks" the formula: it reads the [[steps]] below, creates a parent
epic ticket (the formula itself) with one child wisp per step, wires up the
dependency chain from the `needs` fields, hooks the epic to a fresh agent,
and nudges it to start. The agent then autonomously works through the wisps
in dependency order.

```bash
# 1. Sling the formula (this cooks it into an epic + child wisps automatically)
gt sling agent-validation sfgastown
# Note the agent name from the output (e.g., "obsidian")

# 2. Wait for agent to boot (~30s for pi, ~15s for claude)
sleep 30

# 3. Send the agent a test mail
gt mail send sfgastown/agents/<name> -s "VALIDATION: mail test" -m "Reply with your identity to confirm you received Gas Town context."

# 4. Wait for the agent's reply (check inbox)
#    The reply should contain: role, name, feature, agent runtime, hooked ticket
gt mail inbox   # Look for "VALIDATION: identity confirmed"
gt mail read <reply-id>

# 5. Verify the reply contains VALIDATION_MAIL_OK and correct identity info

# 6. Wait for the agent to complete and hand off
#    The agent will run gt done when finished. Check:
gt agent status sfgastown/<name>   # Should show "done" or session ended
gt mail inbox                        # Look for handoff mail
```

**Validation is complete when:**
- Agent replied with correct identity (role, feature, agent runtime)
- Agent completed all formula steps
- Agent handed off via gt done

## Usage

```bash
# Set agent, then sling
# In ~/gt/settings/config.json: "role_agents": {"agent": "pi"}
gt sling agent-validation sfgastown

# Or for Claude (default):
# "role_agents": {"agent": "opus-46"}
gt sling agent-validation sfgastown
```

## What it does

1. **Context**: Verifies Gas Town identity, role, and startup context are present
2. **Lifecycle**: Checks tmux session for senior engineer boot and QA engineer nudge messages
3. **Hook**: Confirms work is hooked and the ticket is accessible
4. **Tools**: Validates gt and bd CLI tools are functional
5. **Mail**: Waits for mail from the product manager, reads it, and replies to confirm receipt
6. **Task**: Executes an optional test task to prove agent responsiveness
7. **Report**: Prints pass/fail summary and completes the ticket
"""
formula = "agent-validation"
type = "workflow"
version = 3

[vars.task]
description = "Optional test task to execute after validation checks"
required = false
default = "Read the first 5 lines of any source file in this repo and report them."

[[steps]]
id = "verify-context"
title = "Verify Gas Town context was injected"
description = """
Check that Gas Town context is present in your session. You should have received
identity and role information during startup.

**1. Check environment variables:**
```bash
echo "GT_ROLE=$GT_ROLE"
echo "GT_RIG=$GT_RIG"
echo "GT_POLECAT=$GT_POLECAT"
echo "GT_ROOT=$GT_ROOT"
```

At minimum, GT_ROLE should be set (typically "agent").

**2. Verify you know your identity:**
Report the following from your injected context:
- Your role (agent, engineers, etc.)
- The feature you're working in
- The town name (Gas Town)

**3. Check that gt prime output was captured:**
```bash
gt prime 2>/dev/null | head -5
```

Record pass/fail for each check.

**Exit criteria:** Gas Town context is confirmed present in your session."""

[[steps]]
id = "verify-lifecycle"
title = "Verify senior engineer boot and QA engineer nudge were received"
needs = ["verify-context"]
description = """
Confirm that the Gas Town lifecycle infrastructure (QA engineer and senior engineer) fired
correctly during your startup. You should have received these as messages in
your session before you started working.

**1. QA Engineer nudge:**
Check if you received a message from the QA engineer during startup. It looks like:
`[GAS TOWN] <feature>/agents/<name> <- QA engineer • <timestamp> • assigned`
followed by `Run gt prime --hook and begin work on your hook.`

Report whether you saw this QA engineer nudge in your conversation. PASS if yes.

**2. Senior Engineer boot:**
Check if the senior engineer (boot agent) sent you a message or ran any commands in
your session before you started. The senior engineer handles initial session setup.

Report whether senior engineer activity was visible. PASS if yes, SKIP if not seen
(the senior engineer may run silently or be disabled).

**3. gt prime execution:**
Confirm that `gt prime` was executed during your startup (either by you, by
the QA engineer nudge instruction, or by a startup hook). The output should have
included your Gas Town role and context.

```bash
gt prime 2>/dev/null | head -3
```

PASS if gt prime output includes your role and `[GAS TOWN]` header.

**Exit criteria:** QA Engineer nudge confirmed received. Senior Engineer boot noted. gt prime ran."""

[[steps]]
id = "verify-hook"
title = "Verify work is on your hook"
needs = ["verify-lifecycle"]
description = """
Confirm that this validation ticket is hooked to you.

**1. Check your hook:**
```bash
gt hook
```

The output should show a hooked ticket (the validation ticket that tfeaturegered this formula).

**2. Verify the ticket is accessible:**
```bash
bd show $(gt hook --id 2>/dev/null || echo "unknown")
```

If `gt hook --id` isn't available, check `gt hook` output for the ticket ID and use that.

**3. Verify ticket status:**
The hooked ticket should be in_progress.

**Exit criteria:** Hook shows assigned work, ticket is accessible via bd."""

[[steps]]
id = "verify-tools"
title = "Verify Gas Town CLI tools work"
needs = ["verify-hook"]
description = """
Run basic Gas Town commands to verify the CLI is functional.

**1. Check gt is available:**
```bash
gt --version
```

**2. Check bd is available:**
```bash
bd --version
```

**3. Check feature status:**
```bash
gt feature list
```

**4. Check tickets access:**
```bash
bd stats
```

Record pass/fail for each tool check.

**Exit criteria:** Core CLI tools (gt, bd) are functional."""

[[steps]]
id = "verify-mail"
title = "Wait for mail from product manager and reply to confirm"
needs = ["verify-tools"]
description = """
The product manager will send you a test mail after you boot. Wait for it, read it, and
reply to confirm receipt. This validates the full mail round-trip.

**1. Check your inbox for mail from the product manager:**
```bash
gt mail inbox
```

**2. If no mail yet, poll for up to 90 seconds:**
```bash
for i in $(seq 1 18); do
    count=$(gt mail inbox 2>/dev/null | grep -c "VALIDATION" || true)
    if [ "$count" -gt 0 ]; then
        echo "Mail received"
        break
    fi
    echo "Waiting for mail from product manager... ($i/18)"
    sleep 5
done
```

**3. Read the mail:**
```bash
gt mail inbox
# Find the VALIDATION mail and read it:
gt mail read <mail-id>
```

**4. Reply to the product manager confirming your identity and receipt:**
Your reply MUST include identity details extracted from your injected Gas Town prompt:
- Your role (e.g., agent)
- Your name (e.g., obsidian)
- The feature you're in (e.g., sfgastown)
- The agent runtime you're using (e.g., Claude Opus 4.6, Pi/Gemini, OpenCode)
- Your hooked ticket ID

```bash
gt mail send product manager/ -s "VALIDATION: identity confirmed" -m "VALIDATION_MAIL_OK
Role: <your role from prompt>
Name: <your agent name>
Feature: <your feature>
Agent: <your agent runtime/model>
Hooked ticket: <ticket ID>
I received your test mail and confirm my Gas Town identity."
```

This proves the agent actually received and understood its Gas Town context,
not just that mail delivery works.

**5. Mark the mail as read:**
```bash
gt mail mark-read <mail-id>
```

Record pass/fail. If no mail arrives within 90 seconds, record FAIL but continue.

**Exit criteria:** Mail received, read, and reply sent to product manager (or timeout recorded)."""

[[steps]]
id = "execute-task"
title = "Execute a test task"
needs = ["verify-mail"]
description = """
Execute the test task to prove agent responsiveness.

**Task:** {{task}}

Execute the task above and record the output. This proves the agent can
receive instructions and produce results within the Gas Town framework.

**Exit criteria:** Test task executed, output captured."""

[[steps]]
id = "report-and-complete"
title = "Report results and complete"
needs = ["execute-task"]
description = """
Print a summary of all validation checks and complete the ticket.

**1. Print summary:**
```
=== Agent Validation Self-Test ===

Gas Town context:     [PASS/FAIL]
  - Role awareness:   [PASS/FAIL]
  - Feature identity:     [PASS/FAIL]
  - Startup context:  [PASS/FAIL]
Lifecycle:            [PASS/FAIL]
  - QA Engineer nudge:    [PASS/FAIL]
  - Senior Engineer boot:      [PASS/FAIL/SKIP]
  - gt prime fired:   [PASS/FAIL]
Hook assignment:      [PASS/FAIL]
  - Work hooked:      [PASS/FAIL]
  - Ticket accessible:  [PASS/FAIL]
CLI tools:            [PASS/FAIL]
  - gt available:     [PASS/FAIL]
  - bd available:     [PASS/FAIL]
  - Feature list:         [PASS/FAIL]
Mail round-trip:      [PASS/FAIL]
  - Mail received:    [PASS/FAIL]
  - Identity reply:   [PASS/FAIL]
Test task execution:  [PASS/FAIL]

VALIDATION_OK
```

Include VALIDATION_OK in the output if all critical checks pass.

**2. Add results to ticket notes:**
```bash
bd update <ticket-id> --notes "Validation complete. All checks passed."
```

**3. Complete the ticket:**
The ticket will be closed when you finish (via gt done or bd close).

**Exit criteria:** Results summarized, ticket completed."""
